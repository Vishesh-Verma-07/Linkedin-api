<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #111827; color: #e5e7eb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; }
    .card { max-width: 640px; width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 32px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #ffffff; }
    p { color: #9ca3af; line-height: 1.6; margin-bottom: 24px; }
    .endpoint { background: #111827; border: 1px solid #374151; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-family: 'Courier New', monospace; font-size: 0.9rem; }
    .method { color: #34d399; font-weight: bold; }
    .url { color: #e5e7eb; }
    footer { margin-top: 24px; font-size: 0.85rem; color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LinkedIn API</h1>
    <p>A server that scrapes public LinkedIn profile data and serves it through a simple REST API.</p>

    <h1 style="font-size:1rem; margin-bottom:12px;">Endpoints</h1>
    <div class="endpoint"><span class="method">GET</span> <span class="url">/health</span></div>
    <div class="endpoint"><span class="method">GET</span> <span class="url">/api/me</span></div>
    <div class="endpoint"><span class="method">GET</span> <span class="url">/api/profile?url=&lt;linkedin-url&gt;</span></div>
    <div class="endpoint"><span class="method">GET</span> <span class="url">/api/profile/:id</span></div>

    <footer>Built by visheshverma</footer>
  </div>
</body>
</html>
