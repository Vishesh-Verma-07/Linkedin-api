services:
  - type: web
    name: linkedin-api
    runtime: node
    plan: free
    buildCommand: npm install && npx patchright install chromium && npx patchright install-deps chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LINKEDIN_EMAIL
        sync: false
      - key: LINKEDIN_PASSWORD
        sync: false
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_JSESSIONID
        sync: false
    healthCheckPath: /health
